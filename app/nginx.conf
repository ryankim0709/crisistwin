server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fuel rasters are proxied so the browser never makes a cross-origin request.
    # A literal host in proxy_pass is resolved once while the config loads, so a DNS
    # blip at startup stops nginx from booting at all and a later upstream IP change is
    # never picked up. Resolving through a variable defers the lookup to request time,
    # which is why this location needs its own resolver. The host is fixed here, so the
    # proxy still only ever reaches LANDFIRE.
    location ~ ^/landfire/(?<landfire_path>.*)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $landfire_host edcintl.cr.usgs.gov;
        proxy_pass https://$landfire_host/geoserver/landfire/$landfire_path$is_args$args;
        proxy_set_header Host $landfire_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $landfire_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
