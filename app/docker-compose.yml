name: crisistwin

services:
  backend:
    build:
      context: ./backend
      target: development
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-local-development-only-crisistwin}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in the shell or app/.env}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-crisistwin}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Docker forwards container lookups to the host resolver, which drops queries
    # intermittently and reaches the Vite proxy as `getaddrinfo ENOTFOUND
    # edcintl.cr.usgs.gov`. Forward to public resolvers instead. Compose service names
    # still resolve through Docker's embedded resolver at 127.0.0.11.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  node_modules:
